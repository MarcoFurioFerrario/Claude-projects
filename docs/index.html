/* ============ banda in alto: scadenze con countdown e voto sul formato del menu ============ */
/* Tre tappe: proposte (+ voto sul formato) fino alla scadenza, voto dei piatti per 24 ore, poi menu e spesa. */
function vSteps(sg){
  const pf=scadMs('propFine'),vi=scadMs('votoIni'),vf=scadMs('votoFine'),auto=scadOn();
  const cls=i=>{
    const cur={proposte:0,attesa:0,voto:1,menu:2,cucina:2}[sg];
    if(sg==='attesa')return i===0?'done':i===1?'next':'';
    return i<cur?'done':i===cur?'now':'';
  };
  const items=[
    ['Proposte e voto sul formato',auto?'fino a '+fmtDay(pf)+', ore '+fmtHour(pf):'chiude l’organizzatore'],
    ['Voto sui piatti',auto?fmtDay(vi)+', da '+fmtHour(vi)+' a '+(fmtHour(vf)==='00:00'?'mezzanotte':fmtHour(vf)):'quando lo apre l’organizzatore'],
    ['Menu, spesa, cucina','dopo il voto']
  ];
  return `<ol class="steps3">${items.map((x,i)=>`<li class="${cls(i)}"><b>${x[0]}</b><span>${esc(x[1])}</span></li>`).join('')}</ol>`;
}
function vCountdown(){
  const sg=stage(),auto=scadOn();
  let title,sub,target=0;
  if(sg==='proposte'){title='Proposte e voto sul formato aperti';sub='Chiudono '+fmtDT(scadMs('propFine'));target=auto?scadMs('propFine'):0;}
  else if(sg==='attesa'){title='Proposte chiuse';sub='Il voto sui piatti apre '+fmtDT(scadMs('votoIni'));target=scadMs('votoIni');}
  else if(sg==='voto'){title='Voto sui piatti aperto';sub='Chiude '+fmtEnd(scadMs('votoFine'));target=auto?scadMs('votoFine'):0;}
  else{title='Votazioni chiuse';sub='Il menu è in definizione';}
  if(!auto&&sg==='proposte')sub='Le fasi le decide l’organizzatore';
  if(!auto&&sg==='voto')sub='Le fasi le decide l’organizzatore';
  return `<div class="cd"><div class="cd-t"><b>${esc(title)}</b><span class="small">${esc(sub)}</span></div>
    ${target?`<div class="cd-n" role="timer" aria-label="Tempo rimasto"><span class="lbl">mancano</span><span class="num" data-cd="${target}">${fmtCd(target-nowMs())}</span></div>`:''}</div>`;
}
/* Il voto sul formato: tre opzioni accanto, con voti in tempo reale. Ridotto a una riga una volta votato. */
const fmtExpanded=()=>UI.fmtX!=null?UI.fmtX:(fmtOpen()&&!myFmt());
function vFormato(){
  const open=fmtOpen(),mine=myFmt(),t=fmtVotes(),nv=Object.values(t).reduce((a,l)=>a+l.length,0),eff=fmtEff(),en=FMT(eff.key);
  const how={fissato:'scelto dall’organizzatore',voto:'deciso dal voto',provvisorio:'provvisorio: decide il voto alla chiusura'}[eff.how];
  const expanded=fmtExpanded();
  const summary=`<div class="fm-sum"><span>${mine?`Hai scelto <b>${esc(FMT(mine).nome)}</b> (${FMT(mine).tot} piatti). `:(open?'<b>Non hai ancora votato il formato.</b> ':'')}In uso per il menu: <b>${esc(en.nome)}</b>, ${en.tot} piatti <span class="muted">(${esc(how)})</span>.</span>
    <button class="btn sm" data-act="fmt-x" aria-expanded="${expanded}">${expanded?'Chiudi':(open?(mine?'Cambia voto':'Vota ora'):'Vedi risultati')}</button></div>`;
  if(!expanded)return `<div class="fm">${summary}</div>`;
  const cards=FORMATI.map(f=>{
    const n=t[f.key].length,pct=nv?Math.round(n/nv*100):0,on=mine===f.key;
    return `<button class="fmo ${on?'on':''}" data-act="vote-fmt" data-v="${f.key}" aria-pressed="${on}" ${open?'':'disabled'}>
      <span class="fmo-h"><span class="fmo-n">${esc(f.nome)}</span><span class="fmo-t num"><b>${f.tot}</b> piatti</span></span>
      <ul class="fmo-l">${f.righe.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      <span class="fmo-b"><span class="bar"><i style="width:${pct}%"></i></span><span class="small num"><b>${n}</b> vot${n===1?'o':'i'}</span></span>
      <span class="fmo-go">${on?'✓ Il tuo voto':(open?'Voto questo':'')}</span></button>`;
  }).join('');
  const org=isOrg()?`<div class="row" style="gap:8px"><label class="small" for="fx-set">Formato in uso (organizzatore)</label>
    <select id="fx-set" data-chg="setfmt" style="width:auto"><option value="">Decide il voto</option>${FORMATI.map(f=>`<option value="${f.key}" ${S.settings.formato===f.key?'selected':''}>${esc(f.nome)} · ${f.tot}</option>`).join('')}</select></div>`:'';
  return `<div class="fm open">${summary}
    <div class="fmgrid" role="group" aria-label="Formato del menu">${cards}</div>
    <p class="small muted">${open?'Un voto a testa, modificabile fino alla chiusura delle proposte.':'Il voto è chiuso.'} Hanno votato <b class="num">${nv}</b> su <b class="num">${S.participants.length}</b>. A parità vince il formato più abbondante.</p>${org}</div>`;
}
function vBand(){
  const sg=stage();
  return `<section class="wrap band" aria-label="Scadenze e formato del menu">${vCountdown()}${vSteps(sg)}<div class="fm-wrap"><h3>Quanti piatti prepariamo?</h3>${vFormato()}</div></section>`;
}
A['fmt-x']=()=>{UI.fmtX=!fmtExpanded();render();};
A['vote-fmt']=async t=>{
  if(!S.meId)return;
  if(!fmtOpen()){toast('Il voto sul formato è chiuso.','err');return;}
  const k=t.dataset.v;if(!FMT(k))return;
  const ex=S.votes[S.meId];
  const ok=ex?await write('update','votes/'+S.meId,{formato:k,updatedAt:Date.now()}):await write('set','votes/'+S.meId,{formato:k,rank:{},updatedAt:Date.now()});
  if(ok){UI.fmtX=false;toast('Voto registrato: '+FMT(k).nome+' ('+FMT(k).tot+' piatti)');}
  render();
};
CH.setfmt=async t=>{if(isOrg()&&await saveSettings({formato:t.value}))toast(t.value?'Formato fissato: '+FMT(t.value).nome:'Il formato lo decide il voto');};

/* ============ viste: votazioni e menu ============ */
function vVoto(){
  const cat=UI.vcat,sg=stage();
  const tabs=CATS.map(x=>{
    const done=!!myRank(x.key);
    return `<button class="fchip" aria-pressed="${x.key===cat}" data-act="vcat" data-v="${x.key}">${done?'✓ ':''}${esc(x.label)} <span class="num">${catRecipes(x.key).length}</span></button>`;
  }).join('');
  const mine=UI.vmode==='mia';
  const doneN=CATS.filter(c=>catRecipes(c.key).length&&myRank(c.key)).length,needN=CATS.filter(c=>catRecipes(c.key).length).length;
  return `<section class="view">
    <div class="vhead"><div><h2>Votazioni</h2>
      <p class="lede">Per ogni portata assegna le tue prime posizioni: scegli il numero accanto a ogni piatto oppure trascinalo nel suo posto. I piatti che non metti in classifica restano fuori (0 punti). A parità di punti vince chi ha più primi posti, poi più secondi posti e così via.</p></div>
      <div class="filterchips"><button class="fchip" aria-pressed="${mine}" data-act="vmode" data-v="mia">La mia classifica</button><button class="fchip" aria-pressed="${!mine}" data-act="vmode" data-v="ris">Risultati</button></div></div>
    ${sg==='proposte'||sg==='attesa'?`<div class="note"><b>Il voto sui piatti non è ancora aperto.</b> ${scadOn()?`Si apre ${esc(fmtDT(scadMs('votoIni')))} e dura fino a ${esc(fmtEnd(scadMs('votoFine')))}.`:'Lo apre l’organizzatore dalla barra delle fasi.'} Intanto puoi guardare le proposte e votare il formato del menu (banda in alto).</div>`:''}
    ${sg==='voto'&&scadOn()?`<div class="note ok">Votazione aperta fino a ${esc(fmtEnd(scadMs('votoFine')))}.</div>`:''}
    ${sg==='menu'||sg==='cucina'?`<div class="note">Le votazioni sono chiuse. Restano visibili i risultati.</div>`:''}
    <div class="filterchips">${tabs}</div>
    ${mine?`<p class="small muted">Hai ordinato <b class="num">${doneN}</b> categorie su <b class="num">${needN}</b>.</p>`+vRank(cat):vRes(cat)}
  </section>`;
}
function vRank(cat){
  const d=rankedDraft(cat),open=canVote(),n=d.n;
  if(!n)return `<div class="empty"><h3>Nessuna proposta in “${esc(catOf(cat).label)}”</h3><p>Quando ne arriveranno potrai ordinarle qui.</p></div>`;
  const opts=cur=>`<option value="0" ${!cur?'selected':''}>${cur?'Fuori classifica':'Posizione…'}</option>`+Array.from({length:n},(_,i)=>`<option value="${i+1}" ${cur===i+1?'selected':''}>${i+1}° posto · ${rankPts(cat,i+1)} punti</option>`).join('');
  const row=(id,pos)=>{
    const r=R(id),fresh=d.fresh.includes(id);
    return `<div class="dr" data-dish="${esc(id)}"><button type="button" class="grip" data-grip="${esc(id)}" aria-label="Trascina «${esc(r.title)}»" title="Trascina" ${open?'':'disabled'}>⠿</button>
      <div class="dt"><div class="t">${esc(r.title)} ${fresh?badge('Nuova','warn'):''}</div>
      <div class="small muted">${r.region?esc(r.region)+' · ':''}proposta da ${esc(pname(r.proposerId))} · <a href="${esc(safeHref(r.link))}" target="_blank" rel="noopener noreferrer">ricetta ↗</a></div></div>
      <label class="pp"><span class="sr">Posizione di ${esc(r.title)}</span><select id="rk-${esc(id)}" data-chg="rkpos" data-id="${esc(id)}" ${open?'':'disabled'}>${opts(pos)}</select></label></div>`;
  };
  const slots=d.slots.map((id,i)=>`<li class="slot ${id?'on':''}" data-slot="${i}"><div class="pos num">${i+1}</div>${id?row(id,i+1):`<div class="slot-empty">${open?'Trascina qui un piatto o sceglilo dall’elenco sotto':'Posizione libera'}</div>`}</li>`).join('');
  const pool=d.pool.map(r=>`<li>${row(r.id,0)}</li>`).join('');
  let status;
  if(d.dirty)status=badge('Modifiche non salvate','warn');
  else if(d.saved&&d.fresh.length)status=badge('Ci sono proposte nuove: decidi se metterle in classifica','warn');
  else if(d.saved)status=badge('Classifica salvata','ok');
  else status=badge('Non hai ancora votato questa portata','muted');
  const hints=[];
  if(d.filled&&d.filled<n)hints.push(`Hai compilato ${d.filled} ${d.filled===1?'posizione':'posizioni'} su ${n}: più posizioni compili, meno pareggi.`);
  if(d.gaps)hints.push('Ci sono posizioni vuote: salvando, quelle sotto salgono a chiuderle.');
  const canSave=open&&d.filled>0&&(d.dirty||!d.saved);
  return `<div class="rankbox rank">
    <p class="small muted rkinfo">In “${esc(catOf(cat).label)}” classifichi fino a <b class="num">${n}</b> piatti: 1° posto = <b class="num">${rankPts(cat,1)}</b> punti, ${n}° = <b class="num">${rankPts(cat,n)}</b>; fuori classifica 0. Se scegli una posizione già occupata, il piatto che c’era scende alla prima posizione libera sotto, oppure esce.</p>
    <ol class="slots" aria-label="La tua classifica">${slots}</ol>
    <div class="pool" data-drop="pool"><h4>Fuori classifica <span class="num muted">${d.pool.length}</span></h4>
      ${d.pool.length?`<ul class="poolist">${pool}</ul>`:'<p class="small muted">Hai messo in classifica tutte le proposte.</p>'}</div>
    ${hints.length?`<p class="small muted">${hints.join(' ')}</p>`:''}
    <div class="row spread" style="position:sticky;bottom:12px;background:var(--bg);padding:10px 0;border-top:1px solid var(--line)">${status}
    <button class="btn primary" data-act="save-rank" ${canSave?'':'disabled'}>${d.saved&&!d.dirty?'Salvata':(d.dirty||d.saved?'Salva classifica':'Conferma questa classifica')}</button></div></div>`;
}
function vRes(cat){
  const stAll=voteStats()[cat],libero=!!fmtNow().libero,q=libero?0:(quotas(totalCap())[cat]||0);
  const done=voters().length,conf=S.participants.filter(p=>p.confirmed);
  const missing=conf.filter(p=>!voters().some(v=>v.id===p.id)).map(p=>p.name);
  const st=stAll;
  if(!st.length)return `<div class="empty"><h3>Nessuna proposta in questa categoria</h3></div>`;
  const voted=x=>x.score!=null;
  const same=(a,b)=>a&&b&&voted(a)&&voted(b)&&sameVotes(a,b);
  const tie=i=>same(st[i],st[i-1])||same(st[i],st[i+1]);
  /* pari merito a cavallo del limite della quota: serve una decisione dell'organizzatore */
  const edge=q>0&&q<st.length&&same(st[q-1],st[q]);
  const edgeAt=i=>edge&&same(st[i],st[q]);
  const rows=st.map((x,i)=>{
    const inQ=voted(x)&&i<q,pari=voted(x)&&tie(i);
    return `<div class="res ${i<3&&voted(x)?'top3':''} ${inQ?'cut':''}"><div class="pos num">${i+1}</div>
      <div><div style="font-weight:600;overflow-wrap:anywhere">${esc(x.r.title)} ${pari?badge('Pari merito',edgeAt(i)?'warn':'muted'):''}</div><div class="small muted">${x.r.region?esc(x.r.region)+' · ':''}${esc(pname(x.r.proposerId))}${x.r.slot?' · '+badge('In menu','ok'):''}</div></div>
      <div class="bar" title="Punteggio"><i style="width:${voted(x)?x.score:0}%"></i></div>
      <div class="small num" style="text-align:right">${voted(x)?`<b>${x.pts}</b> punti<br><span class="muted">${x.first[0]} primi posti · in classifica per ${x.n} su ${x.nv}</span>`:'<span class="muted">nessun voto</span>'}</div></div>`;
  }).join('');
  return `<div class="note">Hanno votato <b class="num">${done}</b> su <b class="num">${S.participants.length}</b>.${missing.length?` Mancano i confermati: ${esc(missing.join(', '))}.`:''}
    ${libero?`Formato «${esc(fmtNow().nome)}»: nessuna quota per portata, entrano i più votati in assoluto.`:`Le righe evidenziate rientrano nella quota suggerita per “${esc(catOf(cat).label)}” (<b class="num">${q}</b> su ${totalCap()} piatti, formato ${esc(fmtNow().nome)}).`}</div>
    ${edge?`<div class="note warn"><b>Pari merito al limite della quota.</b> Anche contando primi, secondi posti e così via i piatti evidenziati “Pari merito” sono identici: decide l’organizzatore.</div>`:''}
    <div class="panel" style="padding:0;overflow:hidden">${rows}</div>
    <p class="hint">Punteggio: 1° posto = ${rankPts(cat,1)} punti, 2° = ${rankPts(cat,2)}… ultimo posto classificabile = 2; fuori classifica 0. La barra mostra i punti rispetto al massimo possibile (tutti i votanti della portata che mettono il piatto primo). A parità di punti: più primi posti, poi più secondi posti, e così via.</p>`;
}
A.vcat=t=>{UI.vcat=t.dataset.v;render();};
A.vmode=t=>{UI.vmode=t.dataset.v;render();};
CH.rkpos=t=>rankSet(UI.vcat,t.dataset.id,num(t.value));
function rankSet(cat,id,p){
  if(!canVote()){toast('Il voto non è aperto.','err');return;}
  const d=rankedDraft(cat),cur=d.slots.indexOf(id)+1;
  if(cur===p)return;
  const out=rankPlace(d.slots,id,p);
  UI.draft[cat]=out.slots;render();
  if(out.moved){const t=R(out.moved.id).title;toast(out.moved.pos?`«${t}» scende alla posizione ${out.moved.pos}.`:`«${t}» esce dalla classifica: non c’era posto libero sotto.`);}
}
A['save-rank']=async()=>{
  const cat=UI.vcat,d=rankedDraft(cat),ids=d.slots.filter(Boolean);
  if(!S.meId||!ids.length)return;
  const now=Date.now(),patch={rank:{[cat]:ids},rankAt:{[cat]:now},updatedAt:now};
  const ex=S.votes[S.meId];
  const ok=ex?await write('update','votes/'+S.meId,patch):await write('set','votes/'+S.meId,patch);
  if(ok){delete UI.draft[cat];toast('Classifica salvata: '+catOf(cat).label);}
  render();
};

/* --- menu --- */
function dishWarn(r,slotKey){
  const out=[];
  if(!feasible(r,slotKey)){
    const e=earliest(r);
    out.push(badge(`Servono ${leadText(lead(r))} di anticipo`,'bad')+' '+(e?`<span class="small">Primo pasto possibile: <b>${esc(e.label)}</b></span>`:`<span class="small">Non c’è un pasto utile: va preparato a casa.</span>`));

  const st=voteStats(),cand=CATS.map(c=>[c,st[c.key].filter(x=>!x.r.slot)]).filter(g=>g[1].length);
  const candHtml=cand.length?cand.map(([c,xs])=>`<div><h3 class="grp">${esc(c.label)} <span class="muted small num">${xs.length}</span></h3>
    <div class="panel" style="padding:0;overflow:hidden">${xs.map(x=>`<div class="cand"><div><div style="font-weight:600;overflow-wrap:anywhere">${esc(x.r.title)}</div>
      <div class="small muted">${x.r.region?esc(x.r.region)+' · ':''}proposta da ${esc(pname(x.r.proposerId))}</div></div>
      <div class="small num muted" style="text-align:right">${x.score==null?'nessun voto':`punteggio <b style="color:var(--ink)">${x.score}</b> · ${x.n} vot${x.n===1?'o':'i'}`}</div>
      ${org?`<select aria-label="Assegna ${esc(x.r.title)}" data-chg="setslot" data-id="${esc(x.r.id)}"><option value="">Non in menu</option>${SLOTS.map(s=>`<option value="${s.key}">${s.label}</option>`).join('')}</select>`:'<span></span>'}</div>`).join('')}</div></div>`).join('')
    :`<div class="empty"><p>Nessun altro candidato.</p></div>`;
  const noIng=sl.filter(r=>!(r.ingredients||[]).length).length;
  return `<section class="view">
    <div class="vhead"><div><h2>Menu</h2>
      <p class="lede">Formato <b>${esc(fm.nome)}</b>, ${fm.tot} piatti${fm.libero?', senza vincoli su portata e pasto':': '+num(capv.ven)+' per venerdì sera, '+num(capv.sab)+' per sabato, '+num(capv.dom)+' per domenica'}. In menu: <b class="num ${overTot?'bad':''}">${sl.length}</b> / ${tot}. Tocca un piatto per aprire la sua scheda con squadra, ingredienti e tempi.</p></div>
      ${org?`<div class="row">${UI.sugg
        ?`<span class="small">Sostituisce la selezione attuale.</span><button class="btn primary sm" data-act="suggest-go">Applica suggerimento</button><button class="btn sm" data-act="suggest-cancel">Annulla</button>`
        :`<button class="btn" data-act="suggest">Suggerisci dai voti</button><button class="btn" data-act="clear-menu" ${sl.length?'':'disabled'}>Svuota</button>`}</div>`:''}</div>
    ${!org?`<div class="note">Solo gli organizzatori assegnano i piatti ai pasti. Qui puoi vedere il menu e aprire le schede.</div>`:''}

/* pasto con portate obbligatorie (venerdì della Bouffetta): avvisa se manca o avanza qualcosa */
function compNote(fm,sl){
  const out=[];
  for(const [sk,cats] of Object.entries(fm.comp||{})){
    const rs=sl.filter(r=>r.slot===sk);if(!rs.length)continue;
    const miss=cats.filter(c=>!rs.some(r=>r.category===c)).map(c=>catOf(c).label);
    const extra=rs.filter(r=>!cats.includes(r.category)).map(r=>r.title);
    if(miss.length||extra.length)out.push(`<b>${esc(slotLabel(sk))}</b> (${esc(fm.nome)}): ${miss.length?'manca '+esc(miss.join(', ')):''}${miss.length&&extra.length?'; ':''}${extra.length?'fuori schema: '+esc(extra.join(', ')):''}`);
  }
  return out.length?`<div class="note warn">${out.join('<br>')}</div>`:'';
}

function winesInMenu(){

function cartaText(){
  const out=['CARTA DEL BANCHETTO · Gran Bouffe '+(S.settings.tema||''),''];
  for(const sl of SLOTS){
    const rs=slotted().filter(r=>r.slot===sl.key).sort((a,b)=>catIdx(a.category)-catIdx(b.category)||byTitle(a,b));
    if(!rs.length)continue;

    rs.forEach(r=>out.push('- '+r.title+((r.vini||[])[0]?' · '+r.vini[0].nome:'')));

}

/* ============ trascinamento dei piatti nella classifica (mouse e dito, Pointer Events) ============
   Si parte solo dalla maniglia ⠿ (touch-action: none lì), così il resto della riga scorre normalmente sul telefono.
   Durante il trascinamento la pagina non viene ridisegnata (render() aspetta la fine); al rilascio vale la stessa regola del numero scelto a mano. */
(function(){
  let d=null;
  const target=(x,y)=>{
    const e=document.elementFromPoint(x,y);if(!e)return null;
    const s=e.closest('[data-slot]');if(s)return{k:'slot',i:+s.dataset.slot,el:s};
    const p=e.closest('[data-drop="pool"]');return p?{k:'pool',el:p}:null;
  };
  const mark=t=>{
    if(d.hot&&(!t||d.hot.el!==t.el))d.hot.el.classList.remove('over');
    if(t&&(!d.hot||d.hot.el!==t.el))t.el.classList.add('over');
    d.hot=t;
  };
  function move(e){
    if(!d||e.pointerId!==d.pid)return;
    d.x=e.clientX;d.y=e.clientY;
    d.ghost.style.left=(d.x-d.dx)+'px';d.ghost.style.top=(d.y-d.dy)+'px';
    mark(target(d.x,d.y));
  }
  function tick(){
    if(!d)return;
    const m=70,h=window.innerHeight;
    if(d.y<m)window.scrollBy(0,-Math.ceil((m-d.y)/5));else if(d.y>h-m)window.scrollBy(0,Math.ceil((d.y-(h-m))/5));
    mark(target(d.x,d.y));
    d.raf=requestAnimationFrame(tick);
  }
  function end(e,drop){
    if(!d||(e&&e.pointerId!==d.pid))return;
    const x=d;d=null;
    cancelAnimationFrame(x.raf);
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);
    x.ghost.remove();x.row.classList.remove('lifted');if(x.hot)x.hot.el.classList.remove('over');
    document.body.classList.remove('dragging');UI.dragging=false;
    const t=drop?target(e.clientX,e.clientY):null;
    if(t)rankSet(UI.vcat,x.id,t.k==='slot'?t.i+1:0);
    else if(UI.dragPending){UI.dragPending=false;render();}
    UI.dragPending=false;
  }
  const up=e=>end(e,true),cancel=e=>end(e,false);
  document.addEventListener('pointerdown',e=>{
    const g=e.target.closest&&e.target.closest('.grip');
    if(!g||g.disabled||(e.pointerType==='mouse'&&e.button!==0)||d)return;
    const row=g.closest('[data-dish]');if(!row||!canVote())return;
    e.preventDefault();
    const r=row.getBoundingClientRect(),ghost=row.cloneNode(true);
    ghost.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    ghost.classList.add('ghost');
    ghost.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;pointer-events:none;z-index:300`;
    document.body.appendChild(ghost);row.classList.add('lifted');document.body.classList.add('dragging');
    d={id:row.dataset.dish,ghost,row,dx:e.clientX-r.left,dy:e.clientY-r.top,pid:e.pointerId,hot:null,x:e.clientX,y:e.clientY,raf:0};
    UI.dragging=true;
    try{g.setPointerCapture(e.pointerId);}catch(_){}
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cancel);
    d.raf=requestAnimationFrame(tick);
  });
})();

/* ---- equilibrio: cosa abbiamo già e cosa manca (regioni, portate, vini) ---- */
function eqRowsData(){
  const lib=sugLibere(),all=SUG.map(s=>({s,st:sugState(s)})),fm=fmtNow(),q=fm.libero?null:quotas(totalCap());
  /* ogni riga: totali e divisione per regione (p = già proposti, l = ancora da proporre nel catalogo) */
  const split=(prop,libs,rf,lf)=>{
    const rows=REGIONI.map(r=>({r,p:prop.filter(x=>rf(x)===r).length,l:libs.filter(x=>lf(x)===r).length}));
    const resto=prop.length-rows.reduce((a,g)=>a+g.p,0);
    return resto>0?rows.concat([{r:'',p:resto,l:0}]):rows; // regione non indicata o fuori elenco
  };
  const mk=(k,label,prop,menu,libs,rf,lf,extra)=>Object.assign({k,label,tot:prop.length,menu,libere:libs.length,reg:split(prop,libs,rf,lf)},extra||{});
  const rr=x=>x.region,sr=x=>x.r;
  const reg=REGIONI.map(r=>{const rs=S.recipes.filter(x=>x.region===r);return mk(r,r,rs,rs.filter(x=>x.slot).length,lib.filter(s=>s.r===r),rr,sr);});
  const cat=CATS.map(c=>{const rs=S.recipes.filter(x=>x.category===c.key);return mk(c.key,c.label,rs,rs.filter(x=>x.slot).length,lib.filter(s=>s.c===c.key),rr,sr,{q:q?q[c.key]:null});});
  const wt=WTYPES.map(w=>{const xs=all.filter(x=>x.s.wt===w),pr=xs.filter(x=>x.st!=='libera').map(x=>x.s);return mk(w,w,pr,xs.filter(x=>x.st==='menu').length,xs.filter(x=>x.st==='libera').map(x=>x.s),sr,sr);});
  /* verdetti in parole: regioni e (senza quote) portate si confrontano con la media; con un formato a quote le portate con i posti nel menu */
  const media=rows=>rows.reduce((a,r)=>a+r.tot,0)/Math.max(1,rows.length);
  const vs=(rows,m)=>rows.forEach(r=>{
    if(r.q!=null){
      if(r.tot<r.q)r.v={k:'manca',c:'bad',t:`Ne mancano almeno ${r.q-r.tot}: ${r.tot} proposte per ${r.q} posti`};
      else if(r.tot<r.q*1.5)r.v={k:'poche',c:'warn',t:`Poca scelta: ${r.tot} proposte per ${r.q} posti`};
      else if(r.tot>=r.q*4)r.v={k:'molte',c:'info',t:`Molte: ${r.tot} proposte per ${r.q} posti`};
      else r.v={k:'ok',c:'ok',t:`A posto: ${r.tot} proposte per ${r.q} posti`};
    }else if(!(m>0))r.v={k:'zero',c:'info',t:'Nessuna proposta ancora'};
    else{
      if(r.tot<m*0.6)r.v={k:'poche',c:'warn',t:'Poche rispetto alle altre'};
      else if(r.tot>m*1.6)r.v={k:'molte',c:'info',t:'Tante rispetto alle altre'};
      else r.v={k:'ok',c:'ok',t:'Equilibrata'};
    }
  });
  vs(reg,media(reg));vs(cat,media(cat));
  return{reg,cat,wt,q,fm};
}
/* un colore per regione (stesso tono delle etichette di regione); grigio per «regione non indicata» */
const regColor=r=>r?`hsl(${REG_H[r]} 45% var(--reg-l))`:'hsl(0 0% 45%)';
const elenca=a=>a.length>1?a.slice(0,-1).join(', ')+' e '+a[a.length-1]:a.join('');

function vSugg(){
  const all=sugList(),list=filterSug(all),lib=all.length;
  const gia=SUG.length-lib,inMenu=SUG.filter(s=>sugState(s)==='menu').length;

  const opt=(v,cur,lab)=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(lab)}</option>`;
  let body;
  if(!lib)body=`<div class="empty"><h3>Tutti i piatti del catalogo sono già stati proposti</h3><p>Se ne hai in mente un altro, proponilo dalla scheda Proposte.</p><button class="btn" data-act="tab" data-v="proposte">Vai alle Proposte</button></div>`;

function absLabel(t){

}
function vPiatto(){
  const r=R(UI.dish);

  if(!r)return `<section class="view">${back}<div class="empty"><h3>Piatto non trovato</h3><p>Potrebbe essere stato eliminato.</p></div></section>`;
  const f=scaleF(r),n=nConf(),por=PORZ[r.porzione]||PORZ.normale;
  const owners=ownersOf(r),mine=!!S.meId&&owners.includes(S.meId);
  const ings=(r.ingredients||[]).map(i=>{
    const u=normUnit(i.unit),q=num(i.qty);
    const txt=(u.base==='qb'||!q)?'q.b.':fmtQty(u.base,niceQty(u.base,q*u.mult*f));
    return `<tr><td>${esc(cap1(i.name))}${i.note?` <span class="small muted">${esc(i.note)}</span>`:''}</td><td>${esc(txt)}</td></tr>`;
  }).join('');
  const vini=(r.vini||[]).map(v=>{const nb=num(v.bottiglie)>0?roundUp('bottiglie',num(v.bottiglie)*f):0;return `<li><b>${esc(v.nome)}</b> <span class="muted small">· ${nb?fmtN(nb)+' bottigli'+(nb===1?'a':'e')+' per '+n+' persone':'abbinamento suggerito'}</span></li>`;}).join('');
  const fasi=[...(r.fasi||[])].sort((a,b)=>num(b.ore)-num(a.ore));
  const ld=lead(r),e=earliest(r);
  let verdict='';
  if(r.slot){
    verdict=feasible(r,r.slot)
      ?`<div class="note ok">I tempi stanno nel pasto scelto (${esc(slotLabel(r.slot))}).${r.preparabileACasa?' Il piatto si prepara a casa prima di partire.':''}</div>`
      :`<div class="note bad"><b>Non sta nei tempi di ${esc(slotLabel(r.slot))}.</b> Servono ${esc(leadText(ld))} di anticipo, più di quanto resta dall’arrivo.${e?` Il primo pasto possibile è ${esc(e.label)}.`:''} Se la parte lunga si fa a casa prima di partire, spunta “si prepara a casa” nella scheda.
        ${isOrg()&&e?`<div style="margin-top:8px"><button class="btn sm" data-act="move-slot" data-id="${esc(r.id)}" data-v="${e.key}">Sposta a ${esc(e.label)}</button></div>`:''}</div>`;
  }else if(ld>0){
    verdict=`<div class="note">${r.preparabileACasa?'Pensato per essere preparato a casa e portato.':`Servono ${esc(leadText(ld))} di anticipo: ${e?`il primo pasto possibile è <b>${esc(e.label)}</b>.`:'non c’è un pasto utile dopo l’arrivo, va preparato a casa.'}`}</div>`;
  }
  const hasFasi=fasi.length?fasi.map(x=>{
    const when=r.slot?absLabel(slotAbs(r.slot)-num(x.ore)):'−'+leadText(num(x.ore));
    return `<div class="phase"><div class="h">${esc(when)}</div><div>${esc(x.label)}${r.slot?` <span class="small muted">(−${esc(leadText(num(x.ore))||'0')})</span>`:''}</div></div>`;
  }).join(''):`<p class="muted small">Nessuna fase inserita. Aggiungi i passaggi che richiedono anticipo (ammollo, riposo, marinatura) per avere il cronoprogramma.</p>`;
  const empty=!(r.ingredients||[]).length&&!(r.steps||[]).length;
  return `<section class="view">
    <div>${back}</div>
    <div class="hero"><div class="row" style="gap:6px">${chipCat(r.category)}${r.region?`<span class="chip plain">${esc(r.region)}</span>`:''}${r.slot?badge(slotLabel(r.slot),'ok'):badge('Non ancora in menu','muted')}</div>
      <h2>${esc(r.title)}</h2>
      <div class="row"><span class="muted">Proposto da <b style="color:var(--ink)">${esc(pname(r.proposerId))}</b></span>
      ${canEditRecipe(r)?`<button class="btn sm primary" data-act="edit-dish" data-id="${esc(r.id)}">Compila / modifica scheda</button><button class="btn sm" data-act="edit-recipe" data-id="${esc(r.id)}">Dati della proposta</button>`:''}</div></div>
    ${fotoBlock(r)}
    ${verdict}
    <div class="cols">
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="panel"><h3>Team responsabili</h3>
          <div class="people" style="margin-top:10px">${owners.map(id=>`<span class="pill own">${esc(pname(id))}${id===S.meId?' (tu)':''}</span>`).join('')||'<span class="muted small">Nessuno</span>'}</div>
          <p class="hint" style="margin-top:8px">Chiunque può aggiungersi o togliersi. Il team lo gestisce per intero, insieme ai dati del piatto, solo chi l’ha proposto (${esc(pname(r.proposerId))}).</p>
          ${S.meId?`<div class="row" style="margin-top:10px">${canEditRecipe(r)?`<button class="btn sm" data-act="team-edit" data-id="${esc(r.id)}">Gestisci team</button>`:''}<button class="btn sm join ${mine?'on':''}" data-act="owner-toggle" data-id="${esc(r.id)}" aria-pressed="${mine}">${mine?'Esco dai responsabili':'Mi aggiungo ai responsabili'}</button></div>`:''}</div>
        <div class="panel"><h3>Ricetta di riferimento</h3><div style="margin-top:10px">${srcBlock(r)}</div>
          <div style="margin-top:8px">${badge((VSTATI[vstato(r)]||VSTATI.da_verificare).label,(VSTATI[vstato(r)]||VSTATI.da_verificare).cls)}</div></div>
        ${libroPanel(r)}
        <div class="panel"><h3>Vini in abbinamento</h3>${vini?`<ul class="steps" style="margin-top:10px;padding-left:18px">${vini}</ul>`:`<p class="muted small" style="margin-top:8px">Nessun vino indicato.</p>`}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="panel"><div class="row spread"><h3>Ingredienti</h3><span class="small muted">per <b class="num">${n}</b> persone · porzione ${esc(por.label.toLowerCase())}</span></div>
          ${ings?`<table class="ing" style="margin-top:8px"><tbody>${ings}</tbody></table><p class="hint" style="margin-top:8px">Ricetta base per ${fmtN(num(r.serves)||4,0)} persone, scalata sui confermati. Le quantità si aggiornano da sole se cambia il numero dei partecipanti.</p>`
            :`<div class="empty" style="margin-top:10px"><p>Ingredienti non ancora inseriti.</p>${canEditRecipe(r)?`<button class="btn primary sm" data-act="edit-dish" data-id="${esc(r.id)}">Compila la scheda</button>`:'<p class="small">Li inserisce chi ha proposto il piatto.</p>'}</div>`}</div>
        <div class="panel"><h3>Procedimento</h3>${(r.steps||[]).length?`<ol class="steps" style="margin-top:10px">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:`<p class="muted small" style="margin-top:8px">${empty?'Il procedimento sarà inserito insieme agli ingredienti.':'Nessun passaggio inserito.'}</p>`}
          <p class="hint" style="margin-top:8px">Per dosi e dettagli fa fede la ricetta di riferimento.</p></div>
        <div class="panel"><h3>Tempi e consigli</h3><div style="margin-top:8px">${hasFasi}</div>
          ${r.consigli?`<p style="margin-top:10px">${esc(r.consigli)}</p>`:''}</div>
      </div></div></section>`;

/* --- programma --- */
function vProgramma(){
  const sl=slotted();
  if(!sl.length)return `<section class="view"><div class="vhead"><div><h2>Programma</h2></div></div>
    <div class="empty"><h3>Nessun piatto in menu</h3><p>Il cronoprogramma si costruisce dalle fasi inserite nelle schede dei piatti selezionati.</p><button class="btn" data-act="tab" data-v="menu">Vai al menu</button></div></section>`;
  const bad=sl.filter(r=>!feasible(r,r.slot)),nofasi=sl.filter(r=>!(r.fasi||[]).length),home=sl.filter(r=>r.preparabileACasa);
  const longs=sl.filter(r=>lead(r)>=12&&feasible(r,r.slot));
  const win=SLOTS.map(s=>`<tr><td>${esc(s.label)}</td><td class="num" style="text-align:right"><b>${fmtN(Math.max(0,slotOffset(s.key)),1)} h</b> utili dall’arrivo</td></tr>`).join('');
  const items=timeline();
  let curDay=null,tl='';
  for(const it of items){
    const di=Math.floor(it.t/24+1e-9);
    if(di!==curDay){curDay=di;tl+=`<div class="tlday">${esc(dayLabel(di))}</div>`;}
    const who=it.r?ownersOf(it.r).map(pname).join(', '):'';
    tl+=`<div class="ti ${it.kind}"><div class="tm">${fmtT(it.t-di*24)}</div><div class="dot"></div><div class="what">${it.kind==='meal'?esc(it.what):`${esc(it.what)} — <button class="link" data-act="open-dish" data-id="${esc(it.r.id)}">${esc(it.r.title)}</button> ${it.kind==='pre'?badge('prima della partenza','warn'):''}<div class="small muted">${esc(who)}</div>`}</div></div>`;
  }
  const tips=[];
  bad.forEach(r=>{const e=earliest(r);tips.push(`<li><b>${esc(r.title)}</b> è su ${esc(slotLabel(r.slot))} ma richiede ${esc(leadText(lead(r)))} di anticipo. ${e?`Primo pasto possibile: ${esc(e.label)}. ${isOrg()?`<button class="btn sm" data-act="move-slot" data-id="${esc(r.id)}" data-v="${e.key}">Sposta</button>`:''}`:'Preparalo a casa e portalo già pronto.'}</li>`);});
  longs.forEach(r=>tips.push(`<li><b>${esc(r.title)}</b>: ${esc(leadText(lead(r)))} di anticipo. Va avviato presto: controlla il cronoprogramma qui sotto.</li>`));
  if(nofasi.length)tips.push(`<li>Senza fasi né tempi: ${esc(nofasi.map(r=>r.title).join(', '))}. Aggiungili nelle schede per completare il programma.</li>`);
  if(home.length)tips.push(`<li>Da preparare a casa e portare: ${esc(home.map(r=>r.title).join(', '))}.</li>`);
  return `<section class="view">
    <div class="vhead"><div><h2>Programma</h2><p class="lede">Un piatto con lunghe attese (un brodo che riposa 24 ore, un ammollo, una marinatura) non può stare in un pasto troppo vicino all’arrivo. Qui sotto i tempi utili e, per ogni fase, quando va avviata.</p></div>
      ${isOrg()?`<button class="btn" data-act="edit-settings">Orari e arrivo</button>`:''}</div>
    <div class="cols"><div class="panel"><h3>Tempo utile per pasto</h3><table class="ing" style="margin-top:8px"><tbody>${win}</tbody></table>
      <p class="hint" style="margin-top:8px">Arrivo ${esc(S.settings.arrivo)}, meno ${fmtN(num(S.settings.riservaOre),1)} h per scaricare la spesa e sistemarsi.</p></div>
    <div class="panel"><h3>Consigli</h3>${tips.length?`<ul class="steps" style="margin-top:10px;padding-left:18px">${tips.join('')}</ul>`:`<p class="muted" style="margin-top:8px">Tutto sta nei tempi.</p>`}</div></div>
    <div class="panel"><h3>Cronoprogramma</h3><div class="tl" style="margin-top:8px">${tl}</div></div></section>`;
}

/* ============ foto del piatto ============
   La foto viene da una fonte affidabile: si salva solo l'indirizzo dell'immagine (recipes/<id>.foto = {url, pagina, fonte, autore, data}),
   senza copiarla, e sotto compaiono sempre il nome della fonte e il link alla pagina d'origine. */
const fotoOf=r=>{const f=r&&r.foto;return f&&isUrl(f.url)?f:null;};
const canFoto=r=>!!S.meId&&(canEditRecipe(r)||ownersOf(r).includes(S.meId));
const fotoKey=(k,f)=>k+'|'+f.url;
/* html di una foto (di una proposta o di un piatto del catalogo). Le immagini create con AI portano sempre il badge «Creata con AI». */
function fotoMarkup(f,alt,key,cls){
  const pg=isUrl(f.pagina)?f.pagina:'',nome=f.fonte||domain(pg||f.url);
  const cap=f.ai
    ?`<b>Immagine creata con AI</b> a partire dalla ricetta${f.autore?' ('+esc(f.autore)+')':''}: non è una foto del piatto vero.`
    :`Foto: ${pg?`<a href="${esc(safeHref(pg))}" target="_blank" rel="noopener noreferrer">${esc(nome)} ↗</a>`:esc(nome)}${f.autore?' · '+esc(f.autore):''}${pg?wlMark(pg):''}`;
  if(UI.fotoKo&&UI.fotoKo[fotoKey(key,f)])return `<div class="foto ko ${cls||''}"><span>${f.ai?'L’immagine creata con AI non si carica.':`La foto non si carica da qui. ${pg?`Aprila alla fonte: ${cap}`:''}`}</span></div>`;
  return `<figure class="foto ${cls||''}${f.ai?' ai':''}">${f.ai?`<span class="aib" title="Immagine creata con AI, non è una foto del piatto vero">Creata con AI</span>`:''}<img src="${esc(f.url)}" alt="${esc(alt)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-foto="${esc(key)}">
    <figcaption>${cap}</figcaption></figure>`;
}
const fotoFig=(r,cls)=>{const f=fotoOf(r);return f?fotoMarkup(f,'Foto: '+r.title,r.id,cls):'';};
const sugFotoFig=s=>{const f=SUG_FOTO[s.id];return f?fotoMarkup(f,'Foto: '+s.t,'sug:'+s.id,'thumb'):'';};
/* immagine che non si carica (sito che blocca il collegamento diretto, indirizzo cambiato): niente icona rotta, si mostra il link alla fonte */
document.addEventListener('error',e=>{
  const im=e.target;if(!im||im.tagName!=='IMG'||!im.dataset||!im.dataset.foto)return;
  const key=im.dataset.foto,f=key.indexOf('sug:')===0?SUG_FOTO[key.slice(4)]:fotoOf(R(key));if(!f)return;
  UI.fotoKo=UI.fotoKo||{};UI.fotoKo[fotoKey(key,f)]=1;schedule();
},true);

/* nella scheda del piatto: la foto, oppure il riquadro per aggiungerla */
function fotoBlock(r){
  const f=fotoOf(r),can=canFoto(r);
  if(f)return `<div class="fotobox">${fotoFig(r,'big')}${can?`<div class="row" style="gap:8px"><button class="btn sm" data-act="foto-edit" data-id="${esc(r.id)}">Cambia foto</button><button class="btn sm" data-act="foto-del" data-id="${esc(r.id)}">Togli foto</button></div>`:''}</div>`;
  return `<div class="fotobox"><div class="foto-add"><div><b>Nessuna foto per questo piatto.</b><br><span class="small muted">Si usa una foto della ricetta di riferimento, con il nome della fonte sotto.</span></div>
    ${can?`<button class="btn sm primary" data-act="foto-edit" data-id="${esc(r.id)}">+ Aggiungi foto</button>`:''}</div></div>`;
}

/* ---- finestra per aggiungere o cambiare la foto ---- */
function fotoPrev(){
  const e=$('#fo-prev');if(!e||!DR||!DR.foto)return;

  e.innerHTML=(isUrl(u)?`<img src="${esc(u)}" alt="Anteprima della foto" referrerpolicy="no-referrer" class="fo-img">`:'<span class="hint">Incolla l’indirizzo dell’immagine per vedere l’anteprima.</span>')
    +(pg&&isUrl(pg)?`<p class="hint">${fo?`✓ Fonte nella lista di quelle affidabili: ${esc(fo.n)}.`:'Questo sito non è nella lista delle fonti affidabili (vedi README): se possibile scegli una foto da una di quelle.'}</p>`:'');

function openFotoEditor(id){
  const r=R(id);if(!r||!canFoto(r))return;
  const f=fotoOf(r)||{},v=r.verifica||{};
  DR={fid:id,foto:{url:f.url||'',pagina:f.pagina||(isUrl(v.linkAutorevole)?v.linkAutorevole:r.link)||'',fonte:f.fonte||'',autore:f.autore||''}};
  openModal(`<header><div><h3>Foto del piatto</h3><p class="hint">${esc(r.title)}. Usa una foto della ricetta di riferimento: tasto destro sull’immagine → “Copia indirizzo immagine”.</p></div><button class="btn sm" data-act="modal-close">Annulla</button></header>
    <div class="field"><label for="fo-url">Indirizzo dell’immagine *</label><input type="url" id="fo-url" data-in="dr" data-f="foto.url" value="${esc(DR.foto.url)}" placeholder="https://…/foto.jpg" inputmode="url" autocomplete="off"></div>
    <div id="fo-prev"></div>
    <div class="field"><label for="fo-pg">Pagina da cui viene la foto *</label><input type="url" id="fo-pg" data-in="dr" data-f="foto.pagina" value="${esc(DR.foto.pagina)}" placeholder="https://…" inputmode="url" autocomplete="off"></div>
    <div class="formgrid"><div class="field"><label for="fo-fonte">Nome della fonte</label><input type="text" id="fo-fonte" data-in="dr" data-f="foto.fonte" value="${esc(DR.foto.fonte)}" placeholder="se vuoto: si ricava dal sito"></div>
    <div class="field"><label for="fo-autore">Autore o crediti (facoltativo)</label><input type="text" id="fo-autore" data-in="dr" data-f="foto.autore" value="${esc(DR.foto.autore)}"></div></div>
    <p class="err" id="ed-err" hidden></p>
    <div class="foot"><button class="btn" data-act="modal-close">Annulla</button><button class="btn primary" data-act="foto-save">Salva foto</button></div>`,()=>{fotoPrev();});
}
A['foto-edit']=t=>openFotoEditor(t.dataset.id);
A['foto-save']=async()=>{
  const err=m=>{const e=$('#ed-err');e.textContent=m;e.hidden=false;};
  const id=DR&&DR.fid,r=R(id);if(!r||!canFoto(r))return;
  const url=DR.foto.url.trim(),pg=DR.foto.pagina.trim();
  if(!isUrl(url))return err('Incolla l’indirizzo dell’immagine (comincia con https://).');
  if(!/^https:/i.test(url))return err('L’indirizzo dell’immagine deve cominciare con https:// (altrimenti il browser non la mostra).');
  if(!isUrl(pg))return err('Indica la pagina della fonte da cui viene la foto: serve per citarla.');
  const fo=fonteOk(pg);
  const foto={url,pagina:pg,fonte:DR.foto.fonte.trim()||(fo?fo.n:domain(pg)),autore:DR.foto.autore.trim(),data:new Date(nowMs()).toISOString().slice(0,10)};
  if(await write('update','recipes/'+id,{foto})){closeModal();DR=null;if(UI.fotoKo)for(const k of Object.keys(UI.fotoKo))if(k.startsWith(id+'|'))delete UI.fotoKo[k];toast('Foto salvata');}
};
A['foto-del']=async t=>{
  const r=R(t.dataset.id);if(!r||!canFoto(r))return;
  if(await write('update','recipes/'+r.id,{foto:null}))toast('Foto tolta');
};

/* ============ editor (finestre modali con bozza locale) ============ */
let DR=null;
const setPath=(o,path,v)=>{const ks=path.split('.');let c=o;for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null||typeof c[ks[i]]!=='object')c[ks[i]]={};c=c[ks[i]];}c[ks[ks.length-1]]=v;};

IN.dr=t=>{
  if(!DR)return;
  const f=t.dataset.f;
  setPath(DR,f,t.type==='checkbox'?t.checked:t.value);
  if(f==='category'||f==='title')renderIdeas();
  if(f.startsWith('foto.'))fotoPrev();
};
CH.dr=t=>{
  if(!DR)return;
  setPath(DR,t.dataset.f,t.type==='checkbox'?t.checked:t.value);
  if(t.dataset.f==='category')renderIdeas();
};
IN.row=t=>{if(DR)DR[t.dataset.l][+t.dataset.i][t.dataset.k]=t.value;};
CH.row=IN.row;

/* ---------- proposta ---------- */
function ownersHtml(){
  return sortedPeople().map(p=>`<button type="button" class="pick" aria-pressed="${DR.ownerIds.includes(p.id)}" data-act="dr-owner" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join('');
}
function renderOwners(){const e=$('#ed-owners');if(e)e.innerHTML=ownersHtml();}
function renderIdeas(){
  const e=$('#ed-ideas');if(!e||DR.id)return;
  const q=norm(DR.title);
  const list=SUG.filter(i=>(!DR.category||i.c===DR.category)&&sugState(i)==='libera'&&(!q||norm(i.t).indexOf(q)>=0)).slice(0,8);
  const dup=q.length>2?S.recipes.filter(r=>r.id!==DR.id&&(norm(r.title).includes(q)||q.includes(norm(r.title)))):[];
  e.innerHTML=(dup.length?`<p class="err">Esiste già una proposta simile: ${esc(dup.map(r=>r.title).join(', '))}.</p>`:'')
    +(list.length?`<span class="hint">Dai suggerimenti:</span> ${list.map(i=>`<button type="button" class="idea" data-act="dr-idea" data-id="${esc(i.id)}">${esc(i.t)}</button>`).join(' ')}`:'');
}
A['dr-owner']=t=>{
  const id=t.dataset.id,i=DR.ownerIds.indexOf(id);
  if(i<0)DR.ownerIds.push(id);else DR.ownerIds.splice(i,1);
  renderOwners();
};
function syncRecipeInputs(){
  $('#ed-title').value=DR.title;$('#ed-cat').value=DR.category;$('#ed-reg').value=DR.region;$('#ed-link').value=DR.link;
}
A['dr-idea']=t=>{
  const s=sugById(t.dataset.id);if(!s)return;
  Object.assign(DR,sugPre(s));syncRecipeInputs();renderIdeas();$('#ed-link').focus();
};

A['new-recipe']=()=>{if(!canPropose()){toast('Le proposte sono chiuse.','err');return;}openRecipeEditor(null);};
A['edit-recipe']=t=>openRecipeEditor(t.dataset.id);
A['save-recipe']=async()=>{
  const err=m=>{const e=$('#ed-err');e.textContent=m;e.hidden=false;e.scrollIntoView({block:'nearest'});};
  const title=DR.title.trim(),link=DR.link.trim();
  if(!title)return err('Scrivi il nome del piatto.');
  if(!DR.category)return err('Scegli la categoria.');
  if(!link)return err('Aggiungi il link alla ricetta.');
  if(!isUrl(link))return err('Il link deve cominciare con http:// o https://.');
  if(!DR.id&&!DR.ownerIds.length)return err('Indica almeno una persona che cucinerà il piatto.');
  let ok;
  if(DR.id){
    const r=R(DR.id);
    const patch={title,category:DR.category,region:DR.region,link,note:DR.note.trim()};
    if(link!==r.link)patch.verifica={stato:'da_verificare'};
    else if(isOrg())patch.verifica={stato:DR.ver.stato,fonte:DR.ver.fonte||'',linkAutorevole:DR.ver.linkAutorevole||'',nota:DR.ver.nota||''};
    if(isOrg()&&DR.ver.linkAutorevole&&!isUrl(DR.ver.linkAutorevole))return err('Il link alla fonte autorevole non è valido.');
    ok=await write('update','recipes/'+DR.id,patch);
  }else{
    const fo=DR.foto&&isUrl(DR.foto.url)?{url:DR.foto.url,pagina:DR.foto.pagina||'',fonte:DR.foto.fonte||'',autore:DR.foto.autore||'',data:DR.foto.data||'',ai:!!DR.foto.ai}:null;
    ok=await write('set','recipes/'+uid('r'),Object.assign({title,category:DR.category,region:DR.region,link,note:DR.note.trim(),proposerId:S.meId,ownerIds:DR.ownerIds,teamIds:[],
      createdAt:Date.now(),verifica:{stato:DR.verStato||'da_verificare',nota:DR.verNota||''},sugId:DR.sugId||'',slot:'',serves:4,porzione:'normale',ingredients:[],steps:[],fasi:DR.fasi||[],preparabileACasa:false,vini:DR.vini||[],consigli:''},fo?{foto:fo}:{}));
  }
  if(ok){closeModal();toast(DR.id?'Proposta aggiornata':'Proposta aggiunta');DR=null;}
};

  <input type="text" inputmode="decimal" data-in="row" data-l="vini" data-i="${i}" data-k="bottiglie" value="${esc(g.bottiglie===''||g.bottiglie==null?'':g.bottiglie)}" placeholder="Bott." aria-label="Bottiglie">

function renderRows(l){const e=$('#rows-'+l);if(e)e.innerHTML=DR[l].map((g,i)=>ROWS[l](g,i)).join('')||`<p class="hint">Nessuna riga.</p>`;}
A['row-add']=t=>{
  const l=t.dataset.l;
  DR[l].push(l==='ing'?{name:'',qty:'',unit:'g',shop:'dispensa'}:l==='vini'?{nome:'',bottiglie:1}:{label:'',ore:''});

A['row-del']=t=>{DR[t.dataset.l].splice(+t.dataset.i,1);renderRows(t.dataset.l);};

    ${sampleCap?`<div class="panel" style="display:flex;flex-direction:column;gap:8px"><div class="row spread"><div><h4>Bozza con Claude</h4><p class="hint">Propone ingredienti, procedimento, tempi e vini. Claude non apre il link: scrive dalla ricetta tradizionale, quindi controlla sempre le dosi sulla fonte.</p></div>
      <button class="btn" data-act="ai-draft" id="ai-btn">Genera bozza</button></div><p class="small" id="ai-msg" hidden></p></div>`:''}
    <div class="formgrid"><div class="field"><label for="d-serves">La ricetta è per (persone)</label><input type="number" id="d-serves" min="1" step="1" data-in="dr" data-f="serves" value="${DR.serves}"></div>
    <div class="field"><label for="d-porz">Dimensione porzione</label><select id="d-porz" data-chg="dr" data-f="porzione">${Object.keys(PORZ).map(k=>`<option value="${k}" ${DR.porzione===k?'selected':''}>${esc(PORZ[k].label)}</option>`).join('')}</select></div></div>
    <p class="hint" style="margin-top:-8px">Con molti piatti nello stesso pasto conviene la porzione “assaggio”.</p>
    <div class="field"><span class="lbl">Ingredienti</span><datalist id="dl-ing">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <div class="erow h"><span>Ingrediente</span><span>Quantità</span><span>Unità</span><span>Dove</span><span></span></div>
      <div id="rows-ing" style="display:flex;flex-direction:column;gap:6px"></div><div><button type="button" class="btn sm" data-act="row-add" data-l="ing">+ Ingrediente</button></div></div>
    <div class="field"><label for="d-steps">Procedimento (un passaggio per riga)</label><textarea id="d-steps" rows="7" data-in="dr" data-f="stepsText" placeholder="Scrivi i passaggi con parole tue; i dettagli restano nella ricetta di riferimento.">${esc(DR.stepsText)}</textarea></div>
    <div class="field"><span class="lbl">Tempi: cosa va avviato in anticipo</span><p class="hint">Indica le ore prima del servizio. Es. brodo che riposa 24 ore → 24; cottura di 3 ore → 3.</p>
      <div id="rows-fasi" style="display:flex;flex-direction:column;gap:6px"></div><div><button type="button" class="btn sm" data-act="row-add" data-l="fasi">+ Fase</button></div></div>
    <label class="checkline"><input type="checkbox" id="d-casa" data-in="dr" data-f="casa" ${DR.casa?'checked':''}> La parte lunga si prepara a casa prima di partire (e si porta già pronta)</label>

A['edit-dish']=t=>openDishEditor(t.dataset.id);
A['save-dish']=async()=>{
  const err=m=>{const e=$('#ed-err');e.textContent=m;e.hidden=false;e.scrollIntoView({block:'nearest'});};
  const serves=Math.max(1,Math.round(num(DR.serves)));
  if(!num(DR.serves))return err('Indica per quante persone è la ricetta.');
  const ingredients=[];
  for(const g of DR.ing){
    const name=String(g.name||'').trim();if(!name)continue;
    const u=normUnit(g.unit),q=num(g.qty);
    if(u.base!=='qb'&&!q)return err(`Manca la quantità di “${name}” (oppure scegli q.b.).`);
    ingredients.push({name,qty:u.base==='qb'?null:q,unit:u.base==='qb'?'q.b.':g.unit,shop:g.shop||'dispensa'});
  }
  const vini=DR.vini.filter(v=>String(v.nome||'').trim()).map(v=>({nome:String(v.nome).trim(),bottiglie:Math.max(0,num(v.bottiglie))}));
  const fasi=DR.fasi.filter(f=>String(f.label||'').trim()).map(f=>({label:String(f.label).trim(),ore:Math.max(0,num(f.ore))}));
  const steps=String(DR.stepsText||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const ok=await write('update','recipes/'+DR.id,{serves,porzione:DR.porzione,preparabileACasa:!!DR.casa,ingredients,vini,fasi,steps,consigli:String(DR.consigli||'').trim(),updatedAt:Date.now()});
  if(ok){closeModal();toast('Scheda salvata');DR=null;}
};
A['ai-draft']=async()=>{
  const r=R(DR.id),btn=$('#ai-btn'),msg=$('#ai-msg');
  if(!sampleCap||!r)return;
  btn.disabled=true;msg.hidden=false;msg.textContent='Claude sta scrivendo la bozza…';
  const prompt=`Sei un cuoco esperto di cucina regionale italiana. Prepara la scheda tecnica del piatto "${r.title}" (${r.region||'Triveneto'}, categoria: ${catOf(r.category).label}).
Link scelto dal gruppo (non puoi aprirlo: usa la ricetta tradizionale che conosci e, se hai dubbi sulle dosi, scrivilo nei consigli): ${r.link}
Le quantità sono per 4 persone, per un weekend tra amici con molti piatti in sequenza.
Rispondi SOLO con un oggetto JSON di questa forma:
{"ingredienti":[{"nome":"Riso Vialone Nano","qta":320,"unita":"g","negozio":"dispensa"}],"procedimento":["passaggio sintetico"],"fasi":[{"descrizione":"Mettere a bagno i fagioli","oreAnticipo":12}],"preparabileACasa":false,"vini":[{"nome":"Soave Classico","bottiglie":1}],"consigli":"testo breve"}
Regole:
- "unita" è una tra: g, kg, ml, l, pz, spicchi, mazzi, foglie, rametti, cucchiai, cucchiaini, bustine, barattoli, confezioni, fette, bicchieri, bottiglie, teste, coste, pizzichi, q.b. (per sale, olio, pepe usa q.b. e qta 0).
- "negozio" è uno tra: carne (carne, pesce, salumi), latticini (formaggi, latte, burro, uova), ortolano (verdura, frutta, erbe), dispensa (supermercato), altro. Mai vini negli ingredienti.
- "fasi": i passaggi da avviare prima del servizio, con "oreAnticipo" = ore prima di servire (un brodo che riposa 24 ore = 24; la cottura principale va inclusa). Massimo 6 fasi.
- "preparabileACasa": true solo se si può fare per intero prima di partire e portare già pronto.
- "vini": 1 o 2 vini del Triveneto in abbinamento, con le bottiglie per 4 persone.
- "procedimento": massimo 8 passaggi brevi scritti con parole tue. Ingredienti: massimo 25.
- Tutto in italiano.`;
  try{
    const d=await sampleCap.json(prompt,{modelTier:'default'});
    const shops=SHOPS.map(s=>s.key).filter(k=>k!=='cantina');
    DR.ing=(Array.isArray(d.ingredienti)?d.ingredienti:[]).slice(0,30).map(i=>({name:String(i.nome||'').trim(),qty:num(i.qta)||'',unit:UNITS.includes(i.unita)?i.unita:(normUnit(i.unita).base==='qb'?'q.b.':'g'),shop:shops.includes(i.negozio)?i.negozio:'dispensa'})).filter(i=>i.name);
    DR.stepsText=(Array.isArray(d.procedimento)?d.procedimento:[]).slice(0,10).map(s=>String(s).trim()).filter(Boolean).join('\n');
    DR.fasi=(Array.isArray(d.fasi)?d.fasi:[]).slice(0,8).map(f=>({label:String(f.descrizione||'').trim(),ore:num(f.oreAnticipo)})).filter(f=>f.label);
    DR.vini=(Array.isArray(d.vini)?d.vini:[]).slice(0,3).map(v=>({nome:String(v.nome||'').trim(),bottiglie:num(v.bottiglie)||1})).filter(v=>v.nome);
    DR.casa=!!d.preparabileACasa;DR.consigli=String(d.consigli||'').trim();DR.serves=4;
    $('#d-serves').value=4;$('#d-steps').value=DR.stepsText;$('#d-casa').checked=DR.casa;$('#d-cons').value=DR.consigli;
    renderRows('ing');renderRows('fasi');renderRows('vini');
    msg.textContent='Bozza pronta: controlla ingredienti e dosi con la ricetta di riferimento, poi salva.';
  }catch(e){
    const m={not_granted:'Hai negato l’uso di Claude per questa pagina.',rate_limited:'Troppe richieste: riprova tra poco.',invalid_json:'La risposta non era leggibile: riprova.',upstream_error:'Servizio momentaneamente non disponibile: riprova.'};
    msg.textContent=m[e&&e.code]||'Non sono riuscito a generare la bozza.';
  }finally{btn.disabled=false;}
};

/* ============ copie di sicurezza, scarico e ripristino ============ */
const fmtWhen=ts=>new Date(ts).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
let backingUp=false;

function snapshotNow(motivo){
  return{at:Date.now(),by:S.meId||'',motivo,
    p:JSON.stringify(S.participants),r:JSON.stringify(S.allRecipes),v:JSON.stringify(S.votes),s:JSON.stringify(S.spesa),
    m:JSON.stringify(S.settingsExists?S.settings:null)};
}
async function makeBackup(motivo,silent){
  if(!db||S.readOnly||backingUp||!S.loaded.p||!S.loaded.r)return false;
  if(!S.participants.length&&!S.allRecipes.length)return false;
  backingUp=true;
  try{
    const snap=snapshotNow(motivo);
    if(snap.p.length+snap.r.length+snap.v.length+snap.s.length+snap.m.length>900000){
      if(!silent)toast('I dati sono troppo grandi per la copia online: scarica la copia come file.','err');
      return false;
    }
    const id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    if(!await write('set','backups/'+id,snap))return false;
    const item={id,at:snap.at,motivo,by:snap.by,n:{p:S.participants.length,r:S.recipes.length,v:Object.keys(S.votes).length,m:slotted().length}};
    const items=[item].concat(S.backups||[]);
    const keep=items.slice(0,BACKUP_KEEP),drop=items.slice(BACKUP_KEEP);
    const ok=S.metaExists?await write('update','meta/backups',{items:keep}):await write('set','meta/backups',{items:keep});
    for(const d of drop)await write('delete','backups/'+d.id);
    S.dirty=false;
    if(!silent&&ok)toast('Copia di sicurezza salvata');
    return ok;
  }finally{backingUp=false;}
}

const validBackup=o=>o&&typeof o==='object'&&Array.isArray(o.p)&&Array.isArray(o.r)&&o.v&&typeof o.v==='object'&&o.s&&typeof o.s==='object'
  &&o.p.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string')&&o.r.every(x=>x&&typeof x.id==='string'&&typeof x.title==='string');

async function restoreData(d){
  await makeBackup('prima del ripristino',true);
  const jobs=[];
  const arrMap=a=>Object.fromEntries((a||[]).map(x=>{const c=Object.assign({},x);delete c.id;return[x.id,c];}));
  const sync=(coll,cur,target)=>{
    for(const id of cur)if(!(id in target))jobs.push(()=>write('delete',coll+'/'+id));
    for(const id of Object.keys(target))jobs.push(()=>write('set',coll+'/'+id,target[id]));
  };
  sync('participants',S.participants.map(x=>x.id),arrMap(d.p));
  sync('recipes',S.allRecipes.map(x=>x.id),arrMap(d.r));
  sync('votes',Object.keys(S.votes),d.v||{});
  sync('spesa',Object.keys(S.spesa),d.s||{});
  if(d.m)jobs.push(()=>write('set','settings/main',d.m));
  let all=true;
  for(let i=0;i<jobs.length;i+=8){
    const rs=await Promise.all(jobs.slice(i,i+8).map(f=>f()));
    if(rs.includes(false))all=false;
    const el=$('#rs-prog');if(el)el.textContent=Math.min(i+8,jobs.length)+' di '+jobs.length;
  }
  return all;
}
function confirmRestore(d,label){
  DR={restore:d};
  const nr=d.r.filter(x=>!x.eliminata).length,nm=d.r.filter(x=>x.slot&&!x.eliminata).length,nv=Object.keys(d.v||{}).length;
  openModal(`<header><div><h3>Ripristinare questa copia?</h3><p class="hint">${esc(label)}</p></div><button class="btn sm" data-act="modal-close">Annulla</button></header>
    <p>La copia contiene <b>${nr}</b> proposte, <b>${nm}</b> piatti in menu, <b>${d.p.length}</b> partecipanti e i voti di <b>${nv}</b> persone.</p>
    <div class="note warn">I dati attuali verranno sostituiti da questa copia. Prima il sito salva una copia dello stato di adesso, così puoi tornare indietro.</div>
    <div class="foot"><button class="btn" data-act="modal-close">Annulla</button><button class="btn danger" data-act="restore-go">Sì, ripristina</button></div>`);
}

/* barra delle schede: resta dove l'utente l'ha scorsa, la scheda attiva è sempre visibile, le frecce compaiono solo se c'è altro da scorrere */
function tabsArrows(){
  const n=$('.tabs .in'),bar=$('.tabs');if(!n||!bar)return;
  const l=$('.tabarr.l',bar),r=$('.tabarr.r',bar),canL=n.scrollLeft>2,canR=n.scrollLeft+n.clientWidth<n.scrollWidth-2;
  if(l)l.hidden=!canL;if(r)r.hidden=!canR;
  bar.classList.toggle('can-l',canL);bar.classList.toggle('can-r',canR);
}
function tabsFix(left){
  const n=$('.tabs .in');if(!n)return;
  n.scrollLeft=left||0;
  const a=$('.tab[aria-current="page"]',n);
  if(a){const lo=a.offsetLeft-28,hi=a.offsetLeft+a.offsetWidth+28;if(lo<n.scrollLeft)n.scrollLeft=Math.max(0,lo);else if(hi>n.scrollLeft+n.clientWidth)n.scrollLeft=hi-n.clientWidth;}
  tabsArrows();
}

  if(S.participants.some(p=>norm(p.name)===norm(name)))return{err:'Esiste già un partecipante con questo nome: sceglilo dall’elenco.'};
  const first=!S.participants.length;
  const id='p_'+slug(name)+(S.participants.some(p=>p.id==='p_'+slug(name))?'-'+Math.random().toString(36).slice(2,5):'');
  const ord=S.participants.reduce((m,p)=>Math.max(m,p.ord==null?0:p.ord),0)+1;
  const ok=await write('set','participants/'+id,{name,confirmed:!!confirmed,organizer:first,ord,createdAt:Date.now()});
  return ok?{id}:{err:'Non sono riuscito a salvare il nome.'};
}

  toast('Partecipante aggiunto');
};

/* --- eventi (delegati) --- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const f=A[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;
  const f=CH[t.dataset.chg];if(f)f(t,e);
});
document.addEventListener('input',e=>{
  const t=e.target.closest('[data-in]');if(!t)return;
  const f=IN[t.dataset.in];if(f)f(t,e);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-sub]');if(!f)return;
  e.preventDefault();const h=SUB[f.dataset.sub];if(h)h(f,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden&&!(e.target&&e.target.closest&&e.target.closest('input,textarea,select')))closeModal();});
window.addEventListener('hashchange',()=>{routeFromHash();render();});

/* --- avvio --- */
function subscribe(){
  const onErr=k=>e=>{console.error('snapshot',k,e);S.loaded[k]=true;if(e&&e.code==='permission-denied'){S.permDenied=true;S.dbOk=false;}schedule();};
  db.collection('participants').onSnapshot(s=>{S.participants=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));S.loaded.p=true;schedule();},onErr('p'));
  db.collection('recipes').onSnapshot(s=>{S.legacyCats={};S.allRecipes=s.docs.map(d=>{const raw=d.data(),o=Object.assign({},raw,{id:d.id}),a=CAT_ALIAS[raw.category];if(a){S.legacyCats[d.id]=a;o.category=a;}return o;});S.recipes=S.allRecipes.filter(r=>!r.eliminata);S.trash=S.allRecipes.filter(r=>r.eliminata);S.loaded.r=true;schedule();},onErr('r'));
  db.doc('meta/backups').onSnapshot(d=>{S.metaExists=!!d.exists;S.backups=d.exists?(d.data().items||[]):[];schedule();},onErr('meta'));
  db.collection('votes').onSnapshot(s=>{const v={};s.docs.forEach(d=>{v[d.id]=d.data();});S.votes=v;S.loaded.v=true;schedule();},onErr('v'));
  db.collection('spesa').onSnapshot(s=>{const v={};s.docs.forEach(d=>{v[d.id]=d.data();});S.spesa=v;S.loaded.sp=true;schedule();},onErr('sp'));
  db.doc('settings/main').onSnapshot(d=>{S.settingsExists=!!d.exists;S.settings=mergeSettings(d.exists?d.data():null);S.loaded.s=true;schedule();},onErr('s'));
}
async function initArtifact(c){
  const ask=n=>Promise.resolve().then(()=>c.use(n)).catch(()=>null);
  ask('sample').then(v=>{sampleCap=v;});
  ask('downloads').then(v=>{dlCap=v;schedule();});
  ask('user').then(async v=>{
    userCap=v;if(!v)return;
    try{S.owner=!!(await v.isOwner());}catch(e){}
    try{if((await v.can('data.write'))===false)S.readOnly=true;}catch(e){}
    schedule();
  });
  db=await ask('db');
  if(!db){S.dbOk=false;render();return;}
  S.dbOk=true;
  subscribe();
}

/* Versione pubblica (fuori da claude.ai): dati su Firestore, nessun account richiesto. */
function fsAdapter(fs){
  return{
    doc:p=>{const r=fs.doc(p);return{
      get:()=>r.get(),
      set:d=>r.set(d),
      update:async d=>{const s=await r.get();if(!s.exists)throw{code:'invalid_argument',message:'documento inesistente'};return r.set(d,{merge:true});},
      delete:()=>r.delete(),
      onSnapshot:(n,e)=>r.onSnapshot(n,e)};},
    collection:p=>{const c=fs.collection(p);return{onSnapshot:(n,e)=>c.onSnapshot(n,e)};}
  };
}
function initStandalone(){
  S.standalone=true;
  const cfg=window.GB_FIREBASE;
  if(!cfg||!cfg.projectId){S.noConfig=true;S.dbOk=false;render();return;}
  if(!window.firebase||!window.firebase.firestore){S.dbOk=false;render();return;}
  try{
    window.firebase.initializeApp(cfg);
    const f=window.firebase.firestore();
    try{f.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
    db=fsAdapter(f);
  }catch(e){console.error(e);S.dbOk=false;render();return;}
  dlCap={save:async({filename,data})=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:/\.json$/i.test(filename)?'application/json':'text/csv;charset=utf-8'}));a.download=filename;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return{status:'saved'};}};
  S.dbOk=true;
  subscribe();
}
window.addEventListener('offline',()=>{S.offline=true;paintSave();schedule();});
window.addEventListener('online',()=>{S.offline=false;paintSave();schedule();});
document.addEventListener('click',e=>{ // ricorda se i riquadri a tendina sono aperti, anche dopo un aggiornamento dei dati
  const sm=e.target.closest&&e.target.closest('details[id]>summary');
  if(sm){const d=sm.parentElement;UI.open=UI.open||{};UI.open[d.id]=!d.open;}
},true);
/* Countdown: aggiorna i conti alla rovescia ogni secondo senza ridisegnare la pagina; allo scadere ridisegna (la fase cambia). */
setInterval(()=>{
  $$('[data-cd]').forEach(e=>{
    const left=+e.dataset.cd-nowMs();
    if(left<=0){if(!e.dataset.done){e.dataset.done='1';schedule();}e.textContent=fmtCd(0);}else e.textContent=fmtCd(left);
  });
},1000);
setInterval(()=>{ // copia di sicurezza periodica, solo se ci sono state modifiche
  if(!db||!S.dirty||S.pending>0||S.offline)return;
  const last=(S.backups[0]&&S.backups[0].at)||0;
  if(Date.now()-last>=BACKUP_EVERY)makeBackup('automatico',true);
},window.GB_TICK||60000);
/* Avviso di nuova versione: la pagina pubblica confronta il proprio id di build con docs/version.json. */
async function checkVersion(){
  if(!S.standalone)return;
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const v=await r.json();
    if(v&&v.build&&v.build!==BUILD&&S.newVersion!==v.build){S.newVersion=v.build;schedule();}
  }catch(e){}
}
A['reload-new']=()=>{
  try{location.href=location.pathname+'?v='+encodeURIComponent(S.newVersion||Date.now())+location.hash;}catch(e){location.reload();}
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVersion();});
async function init(){
  S.offline=typeof navigator!=='undefined'&&navigator.onLine===false;
  S.meId=store.get('gb.me')||null;
  routeFromHash();
  render();
  const c=window.claude;
  if(c&&typeof c.use==='function')return initArtifact(c);
  initStandalone();
  checkVersion();
  setInterval(checkVersion,window.GB_VER_TICK||5*60*1000);
}
init();

})();
